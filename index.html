<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@kfonts/nanum-square-round@0.2.0/index.css" rel="stylesheet">
<style id="appCss"></style>
<style>
  html, body { margin: 0; height: 100%; background: #15181d; color: #fff; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }
  #join { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; }
  #join h1 { font-size: 24px; margin: 0; }
  #join input { font-size: 32px; width: 7em; text-align: center; letter-spacing: .15em; padding: 8px; border-radius: 10px; border: 0; }
  #join button { font-size: 18px; padding: 10px 22px; border-radius: 10px; border: 0; background: #1a5fd0; color: #fff; }
  #hint { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 3; text-align: center; font-size: 13px; background: rgba(20,24,30,.92); color: #fff; padding: 8px 10px; border-radius: 10px; pointer-events: none; }
  #hint[hidden] { display: none; }
  #msg { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 14px; color: #c9d1d9; pointer-events: none; }
  #box { position: absolute; left: 0; top: 0; overflow: hidden; background: #fff; box-shadow: 0 2px 18px rgba(0,0,0,.5); }
  #page { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #ink { position: absolute; left: 0; top: 0; pointer-events: none; }
  #cover { position: absolute; inset: 0; display: none; }
  #cover.black { display: block; background: #000; }
  #cover.white { display: block; background: #fff; }
  .sl-yt-open { display: none !important; }
  #sender { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
  #sender[hidden], #join[hidden] { display: none; }
  #sender h1 { font-size: 20px; margin: 0; }
  .send-code { font-size: 40px; font-weight: 800; letter-spacing: .12em; }
  .send-note { font-size: 13px; color: #c9d1d9; }
  /* 💬 답하기 칸 */
  #ans { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 4; max-width: 640px; margin: 0 auto; max-height: 60vh; overflow: auto; box-sizing: border-box;
    background: #fff; color: #111; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.45); padding: 10px 12px; font: 15px/1.45 'Noto Sans KR', sans-serif; text-align: left; }
  #ans[hidden], #ansTab[hidden] { display: none; }
  #ans .ans-head { display: flex; gap: 8px; align-items: center; }
  #ans .ans-head b { white-space: nowrap; }
  #ansTitle { flex: 1; min-width: 0; color: #555; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ansMin { border: 0; background: #e8eef8; color: #123; border-radius: 8px; padding: 2px 12px; font-size: 16px; }
  #ans .ans-name { display: flex; gap: 6px; align-items: center; margin: 8px 0 6px; font-size: 13px; color: #333; }
  #ansName { flex: 1; min-width: 0; font-size: 16px; padding: 6px 8px; border: 1px solid #c8d0dc; border-radius: 8px; color: #111; background: #fff; }
  #ansText { display: block; width: 100%; box-sizing: border-box; font: 16px/1.5 'Noto Sans KR', sans-serif; padding: 8px; border: 1px solid #c8d0dc; border-radius: 8px; resize: vertical; color: #111; background: #fff; }
  #ans .ans-count { text-align: right; font-size: 12px; color: #777; }
  #ans .ans-picks { display: flex; flex-wrap: wrap; gap: 8px; }
  #ans .ans-picks button { min-width: 52px; font-size: 20px; padding: 6px 12px; border-radius: 10px; border: 1px solid #9fb0c6; background: #f4f7fb; color: #123; }
  #ans .ans-picks button.on { background: #1a5fd0; color: #fff; border-color: #1a5fd0; }
  #ans .ans-ox { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #ans .ans-ox span { min-width: 2.2em; font-weight: 700; }
  #ans .ans-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #ansState { flex: 1; font-size: 13px; color: #1a7f37; }
  #ansState.err { color: #c62828; }
  #ansSend { font-size: 16px; padding: 8px 18px; border-radius: 10px; border: 0; background: #1a5fd0; color: #fff; }
  #ansSend:disabled { background: #a7b0bb; }
  #ans.closed #ansText, #ans.closed .ans-picks button { opacity: .6; }
  #ansTab { position: fixed; right: 12px; bottom: 12px; z-index: 4; }
  #ansTab button { font: 700 16px 'Noto Sans KR', sans-serif; padding: 10px 16px; border-radius: 22px; border: 0; background: #1a5fd0; color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="join" hidden>
  <h1>📡 수업 화면</h1>
  <div>선생님이 알려 준 숫자 6자리를 넣으세요</div>
  <input id="codeIn" inputmode="numeric" maxlength="6" autocomplete="off">
  <button id="go">들어가기</button>
</div>
<div id="box" hidden><div id="page"></div><canvas id="ink"></canvas><div id="cover"></div></div>
<div id="ans" hidden>
  <div class="ans-head"><b>✏️ 답하기</b><span id="ansTitle"></span><button id="ansMin" title="접기">▾ 접기</button></div>
  <label class="ans-name">번호·별명 <input id="ansName" maxlength="12" autocomplete="off" placeholder="실명 대신 번호나 별명 (예: 12번)"></label>
  <div id="ansBody"></div>
  <div class="ans-foot"><span id="ansState"></span><button id="ansSend">보내기</button></div>
</div>
<div id="ansTab" hidden><button id="ansOpen">✏️ 답하기</button></div>
<div id="hint" hidden></div>
<div id="msg"></div>
<script>
/*
 * 학생 화면(구글 바깥에 두는 판): 학습지 공방 📡 학생 화면의 중계 웹앱에서 선생님이 띄운 장과 펜 글씨를
 * 3초쯤마다 바뀐 것만 받아 온다(fetch, 쿠키 없이 — 휴대폰에 구글 계정이 로그인돼 있어도 막히지 않게).
 * 주소: …/live/?c=숫자6자리. 펜 글씨는 슬라이드 기준 좌표(px)라서 화면 크기가 달라도 같은 자리에 그린다.
 * relay/Student.html과 같은 그리기(고치면 둘 다).
 */
var RELAY = 'https://script.google.com/macros/s/AKfycbyIB8s4N0TU1xub5iuVCRgkWoITX1yRUR13KfyBvEBC6f7-j3PqWBR3_vK3Gmk_H9m6wQ/exec';
var CODE = (new URLSearchParams(location.search).get('c') || '').replace(/\D/g, '').slice(0, 6);
var HAVE = { h: 0, s: 0, c: 0, g: 0, n: 0, a: 0 }, PAGE = null, INK = [], LIVEST = null, timer = null, fails = 0;
var USE_JSONP = false, jsonpN = 0;   // fetch가 두 번 막히면 스크립트로 불러 쓰는 방식(JSONP)으로 바꿈

function $(id) { return document.getElementById(id); }
function say(t) { $('msg').textContent = t || ''; }

function join(code) {
  code = String(code || '').replace(/\D/g, '').slice(0, 6);
  if (code.length !== 6) { $('join').hidden = false; say(code ? '숫자 6자리를 넣어 주세요.' : ''); return; }
  CODE = code;
  $('join').hidden = true;
  say('선생님 화면을 기다리는 중…');
  try { history.replaceState(null, '', '?c=' + code); } catch (e) { /* 무시 */ }
  poll();
}

function stateUrl() {
  return RELAY + '?api=state&code=' + CODE + '&h=' + HAVE.h + '&s=' + HAVE.s + '&cv=' + HAVE.c + '&g=' + HAVE.g + '&n=' + HAVE.n + '&av=' + HAVE.a + '&t=' + Date.now();
}

function poll() {
  clearTimeout(timer);
  (USE_JSONP ? jsonp(stateUrl()) : fetch(stateUrl(), { credentials: 'omit', cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text().then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('대답이 JSON이 아님: ' + t.slice(0, 60)); } });
  })).then(function (r) {
    if (r && r.error) throw new Error('중계: ' + r.error);
    apply(r);
  }).catch(function (err) {
    fails++;
    if (!USE_JSONP && fails >= 2) { USE_JSONP = true; fails = 0; }
    say('연결이 잠시 끊겼어요. 다시 잇는 중… (' + (USE_JSONP ? 'J ' : 'F ') + String(err && err.message || err).slice(0, 80) + ')');
    timer = setTimeout(poll, Math.min(10000, 2000 * (fails + 1)) * (0.8 + Math.random() * 0.4));
  });
}

/** 스크립트 태그로 불러오기(JSONP): 브라우저가 fetch를 막을 때 */
function jsonp(url) {
  return new Promise(function (resolve, reject) {
    var name = '__live' + (++jsonpN), s = document.createElement('script'), done = false;
    var end = function () { done = true; try { delete window[name]; } catch (e) { window[name] = undefined; } s.remove(); };
    window[name] = function (d) { end(); resolve(d); };
    s.onerror = function () { if (!done) { end(); reject(new Error('스크립트로도 못 읽음')); } };
    setTimeout(function () { if (!done) { end(); reject(new Error('대답 없음(10초)')); } }, 10000);
    s.src = url + '&cb=' + name;
    document.head.appendChild(s);
  });
}

function apply(r) {
  fails = 0;
  r = r || {};
  if (r.none) { say('코드 ' + CODE + ' 수업을 찾지 못했어요. 숫자를 확인하거나 선생님이 학생 화면을 켤 때까지 기다려 주세요.'); timer = setTimeout(poll, 3000 + Math.random() * 1000); return; }
  if (r.closed) { $('box').hidden = true; ansUpdate(null); say('수업 화면이 끝났습니다. 고마워요!'); return; }
  if (r.css != null) { $('appCss').textContent = r.css; HAVE.c = r.c; }
  if (r.page) {
    var moved = !PAGE || PAGE.key !== r.page.key;
    PAGE = r.page; HAVE.h = r.h; $('page').innerHTML = PAGE.html; $('cover').className = PAGE.cover || '';
    if (moved) window.scrollTo(0, 0);   // 다른 쪽·문항이면 맨 위부터(정답을 열어 같은 쪽을 다시 받을 때는 그대로)
  }
  // 펜 글씨: from이 있으면 가진 획 뒤에 이어 붙임. live = 선생님이 지금 긋는 중인 획
  if (r.ink) { INK = r.from ? INK.slice(0, r.from).concat(r.ink) : r.ink; LIVEST = r.live || null; HAVE.s = r.s; HAVE.g = r.g || 0; HAVE.n = INK.length; }
  if (r.a) { HAVE.a = r.a; ansUpdate(r.ask); }   // 💬 지금 답을 받는 문항
  if (r.page || r.ink || r.css != null) layout();
  say('');
  // 3초쯤마다(학생마다 조금씩 흩어서) — 한 반이 한꺼번에 물으면 구글 서버(동시 실행 약 30개)가 막혀 선생님 보내기가 밀린다
  timer = setTimeout(poll, 2500 + Math.random() * 1000);
}

function layout() {
  if (!PAGE) return;
  // 학습지(fit = width): 화면 폭에 맞추고 위아래로 스크롤(두 손가락으로 크게 보기도). 슬라이드: 화면 안에 다 보이게
  var W = PAGE.W, H = PAGE.H, doc = PAGE.fit === 'width';
  document.documentElement.style.overflow = doc ? 'auto' : '';
  document.body.style.overflow = doc ? 'visible' : '';
  var vw = document.documentElement.clientWidth || window.innerWidth, vh = window.innerHeight;
  var s = doc ? Math.min(vw / W, 2.5) : Math.min(vw / W, vh / H), bw = Math.floor(W * s), bh = Math.floor(H * s);
  var box = $('box');
  box.hidden = false;
  box.style.width = bw + 'px'; box.style.height = bh + 'px';
  box.style.left = Math.floor((vw - bw) / 2) + 'px'; box.style.top = Math.max(0, Math.floor((vh - bh) / 2)) + 'px';
  // 학습지 글씨가 작게 보이는 세로 휴대폰: 한 번만 안내(5초)
  if (doc && s < 0.75 && vh > vw && !layout.hinted) {
    layout.hinted = true;
    $('hint').textContent = '글씨가 작으면 휴대폰을 가로로 돌리거나 두 손가락으로 벌려 크게 보세요';
    $('hint').hidden = false;
    setTimeout(function () { $('hint').hidden = true; }, 5000);
  }
  var pg = $('page');
  pg.style.width = W + 'px'; pg.style.height = H + 'px'; pg.style.transform = 'scale(' + s + ')';
  drawInk(s, bw, bh);
}

/** 펜 글씨: {c 색, a 비침, w 굵기(슬라이드 px), pw 누르는 힘 굵기, p [x, y, 힘, …]} */
function drawInk(s, bw, bh) {
  var cv = $('ink'), d = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = bw + 'px'; cv.style.height = bh + 'px';
  cv.width = Math.round(bw * d); cv.height = Math.round(bh * d);
  var ctx = cv.getContext('2d');
  ctx.setTransform(d * s, 0, 0, d * s, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  (LIVEST ? INK.concat([LIVEST]) : INK).forEach(function (st) {
    var a = st.p || [], n = a.length / 3;
    if (!n) return;
    var X = function (i) { return a[i * 3]; }, Y = function (i) { return a[i * 3 + 1]; }, P = function (i) { return a[i * 3 + 2]; };
    ctx.strokeStyle = st.c; ctx.globalAlpha = st.a == null ? 1 : st.a; ctx.lineWidth = st.w;
    if (st.pw && n > 1) {
      var px = X(0), py = Y(0);
      for (var j = 1; j < n; j++) {
        var ex = j + 1 < n ? (X(j) + X(j + 1)) / 2 : X(j), ey = j + 1 < n ? (Y(j) + Y(j + 1)) / 2 : Y(j);
        ctx.lineWidth = st.w * (P(j) < 0 ? 1 : 0.35 + 1.3 * P(j));
        ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(X(j), Y(j), ex, ey); ctx.stroke();
        px = ex; py = ey;
      }
    } else {
      ctx.beginPath(); ctx.moveTo(X(0), Y(0));
      if (n === 1) ctx.lineTo(X(0) + 0.1, Y(0) + 0.1);
      for (var i = 1; i < n - 1; i++) ctx.quadraticCurveTo(X(i), Y(i), (X(i) + X(i + 1)) / 2, (Y(i) + Y(i + 1)) / 2);
      if (n > 1) ctx.lineTo(X(n - 1), Y(n - 1));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}

/*
 * 💬 답하기: 선생님이 문항 하나를 열면(state의 ask) 아래에 답 칸이 뜬다. 번호·별명(기기에 기억)과 답을 보내면
 * 선생님 화면의 답 보드에 들어간다. 다시 보내면 고쳐진다. 다른 학생의 답은 보이지 않는다.
 * ask: {id, kind: text|choice|ox, title, n(보기 수·O/X 줄 수), open}
 */
var ASK = null, ANS = { sent: {}, pick: [], busy: false, min: false }, ANS_MEM = {};
function ansStore(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { if (v === undefined) return ANS_MEM[k] || null; ANS_MEM[k] = v; }
  return null;
}
function ansWho() {
  var w = ansStore('hakseupjiLiveWho');
  if (!/^[a-z0-9]{6,24}$/.test(w || '')) { w = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).slice(0, 20); ansStore('hakseupjiLiveWho', w); }
  return w;
}
function ansEsc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var ANS_CIRCLE = '①②③④⑤⑥⑦⑧⑨⑩';

/** 중계가 알려 준 지금 문항(바뀌었을 때만 온다) */
function ansUpdate(ask) {
  if (!ask) { ASK = null; $('ans').hidden = true; $('ansTab').hidden = true; return; }
  var fresh = !ASK || ASK.id !== ask.id;
  ASK = ask;
  if (fresh) {
    ANS.pick = [];
    var prev = ANS.sent[ask.id] || '';
    if (ask.kind === 'text') {
      $('ansBody').innerHTML = '<textarea id="ansText" rows="3" maxlength="300" placeholder="여기에 답을 쓰세요"></textarea><div class="ans-count"><span id="ansCount">0</span> / 300</div>';
      $('ansText').value = prev;
      $('ansCount').textContent = prev.length;
    } else if (ask.kind === 'choice') {
      var b = '';
      for (var i = 1; i <= ask.n; i++) b += '<button data-pick="0" data-v="' + i + '">' + (ANS_CIRCLE.charAt(i - 1) || i) + '</button>';
      $('ansBody').innerHTML = '<div class="ans-picks">' + b + '</div>';
      if (prev) ANS.pick = [prev];
    } else {
      var rows = '';
      for (var j = 0; j < ask.n; j++) rows += '<div class="ans-ox"><span>' + (j + 1) + '.</span><div class="ans-picks"><button data-pick="' + j + '" data-v="O">O</button><button data-pick="' + j + '" data-v="X">X</button></div></div>';
      $('ansBody').innerHTML = rows;
      if (prev) ANS.pick = prev.split('');
    }
    ansPaintPicks();
    ANS.min = false;
    ansState(prev ? '✓ 보냈어요. 고쳐서 다시 보낼 수 있어요.' : '');
  }
  $('ansTitle').textContent = ask.title || '';
  $('ans').classList.toggle('closed', !ask.open);
  if (!ask.open) ansState('선생님이 답 받기를 마감했어요.', !ANS.sent[ask.id]);
  else if (!fresh && /마감/.test($('ansState').textContent)) ansState(ANS.sent[ask.id] ? '✓ 보냈어요. 고쳐서 다시 보낼 수 있어요.' : '');
  ansShow();
}
function ansShow() {
  if (!ASK) return;
  $('ans').hidden = ANS.min;
  $('ansTab').hidden = !ANS.min;
  $('ansSend').disabled = ANS.busy || !ASK.open;
  Array.prototype.forEach.call($('ansBody').querySelectorAll('textarea, button'), function (x) { x.disabled = !ASK.open; });
  if (!$('ansName').value) $('ansName').value = ansStore('hakseupjiLiveName') || '';
}
function ansState(t, err) { $('ansState').textContent = t || ''; $('ansState').className = err ? 'err' : ''; }
function ansPaintPicks() {
  Array.prototype.forEach.call($('ansBody').querySelectorAll('[data-pick]'), function (b) {
    var k = ASK && ASK.kind === 'choice' ? 0 : Number(b.dataset.pick);
    b.classList.toggle('on', ANS.pick[k] === b.dataset.v);
  });
}
function ansValue() {
  if (ASK.kind === 'text') return ($('ansText').value || '').trim();
  if (ASK.kind === 'choice') return ANS.pick[0] || '';
  for (var i = 0; i < ASK.n; i++) if (!ANS.pick[i]) return '';
  return ANS.pick.slice(0, ASK.n).join('');
}
var ANS_ERR = { closed: '선생님이 답 받기를 마감했어요.', ask: '선생님이 다른 문항으로 넘어갔어요.', rate: '조금 뒤(3초)에 다시 보내 주세요.',
  name: '번호나 별명을 써 주세요.', empty: '답을 써 주세요.', pick: '답을 골라 주세요.', full: '이 문항은 받을 수 있는 인원이 다 찼어요.', session: '수업 화면이 끝났어요.' };
function ansSendNow() {
  if (!ASK || ANS.busy) return;
  var name = ($('ansName').value || '').trim(), v = ansValue();
  if (!name) { ansState(ANS_ERR.name, true); $('ansName').focus(); return; }
  if (!v) { ansState(ASK.kind === 'text' ? ANS_ERR.empty : (ASK.kind === 'ox' ? '모든 줄에 O나 X를 골라 주세요.' : ANS_ERR.pick), true); return; }
  ansStore('hakseupjiLiveName', name);
  ANS.busy = true; ansShow(); ansState('보내는 중…');
  var aid = ASK.id;
  ansTransport({ aid: aid, who: ansWho(), nm: name, t: v }).then(function (r) {
    if (r && r.ok) { ANS.sent[aid] = v; ansState(r.edit ? '✓ 고친 답을 보냈어요.' : '✓ 보냈어요. 고쳐서 다시 보낼 수 있어요.'); return; }
    ansState(ANS_ERR[r && r.error] || '보내지 못했어요. 다시 눌러 주세요.', true);
  }, function () { ansState('보내지 못했어요. 다시 눌러 주세요.', true); }).then(function () { ANS.busy = false; ansShow(); });
}
$('ansSend').addEventListener('click', ansSendNow);
$('ansMin').addEventListener('click', function () { ANS.min = true; ansShow(); });
$('ansOpen').addEventListener('click', function () { ANS.min = false; ansShow(); });
$('ansBody').addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-pick]');
  if (!b || !ASK || !ASK.open) return;
  ANS.pick[ASK.kind === 'choice' ? 0 : Number(b.dataset.pick)] = b.dataset.v;
  ansPaintPicks();
});
$('ansBody').addEventListener('input', function (e) { if (e.target.id === 'ansText') $('ansCount').textContent = e.target.value.length; });

/** 답 보내기(상태를 읽는 길과 같게: fetch, 막히면 JSONP) */
function ansTransport(q) {
  var url = RELAY + '?api=answer&code=' + CODE + '&aid=' + encodeURIComponent(q.aid) + '&who=' + q.who + '&nm=' + encodeURIComponent(q.nm) + '&t=' + encodeURIComponent(q.t) + '&ts=' + Date.now();
  if (USE_JSONP) return jsonp(url);
  return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text().then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('대답이 JSON이 아님'); } });
  });
}

window.addEventListener('resize', layout);
$('go').addEventListener('click', function () { join($('codeIn').value); });
$('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') join($('codeIn').value); });
join(CODE);
</script>
